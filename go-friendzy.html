<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Friendzy | NULL CLUB</title>
  <meta name="description" content="Get Friendzy, free party games for your friend group.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link href="/css/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <div class="page-content" style="text-align:center">
      <h1>Get Friendzy 🦊</h1>
      <p id="msg">Free party games for your friend group. Taking you to your app store…</p>
      <p lang="es" id="msg-es">Juegos de fiesta gratis para tu grupo. Te llevamos a tu tienda de apps…</p>
      <div class="cta-row" style="justify-content:center">
        <a href="https://apps.apple.com/app/id6782549607" id="appstore" class="cta" target="_blank" rel="noopener noreferrer">App Store</a>
        <a href="https://play.google.com/store/apps/details?id=com.nullclub.friendzy" id="playstore" class="cta cta-ghost" target="_blank" rel="noopener noreferrer">Google Play</a>
      </div>
      <p class="app-outro"><a href="friendzy.html">About Friendzy</a></p>
    </div>
  </main>
  <script>
    (function () {
      // Flip to true the day Apple approves Friendzy for iPhone.
      var iosLive = false;
      var appStoreUrl = "https://apps.apple.com/app/id6782549607";
      var playStoreUrl = "https://play.google.com/store/apps/details?id=com.nullclub.friendzy";
      var ua = navigator.userAgent || navigator.vendor || "";
      var isAndroid = /Android/i.test(ua);
      var isiOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      var appBtn = document.getElementById("appstore");
      var playBtn = document.getElementById("playstore");
      if (isAndroid) {
        window.location.replace(playStoreUrl);
        return;
      }
      if (isiOS) {
        // iPhone/iPad visitors only ever see the App Store (App Review, Guideline 2.3.10).
        playBtn.style.display = "none";
        if (iosLive) window.location.replace(appStoreUrl);
        return;
      }
      if (!iosLive) {
        appBtn.textContent = "iPhone: coming soon";
        appBtn.removeAttribute("href");
        appBtn.setAttribute("aria-disabled", "true");
        appBtn.style.opacity = "0.5";
      }
    })();
  </script>
</body>
</html>

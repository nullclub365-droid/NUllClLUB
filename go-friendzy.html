<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Friendzy | NULL CLUB</title>
  <meta name="description" content="Get Friendzy, free party games for your friend group. iPhone users go to the App Store, Android users go to Google Play.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <div class="page-content" style="text-align:center">
      <h1>Get Friendzy 🦊</h1>
      <p id="msg">Free party games for your friend group. Taking you to your app store…</p>
      <p lang="es" id="msg-es">Juegos de fiesta gratis para tu grupo. Te llevamos a tu tienda de apps…</p>
      <div class="cta-row" style="justify-content:center">
        <a href="https://apps.apple.com/app/id6782549607" id="appstore" class="cta" target="_blank" rel="noopener noreferrer">App Store</a>
        <a href="https://play.google.com/store/apps/details?id=com.nullclub.friendzy" id="playstore" class="cta cta-ghost" target="_blank" rel="noopener noreferrer">Google Play</a>
      </div>
      <p class="app-outro"><a href="friendzy.html">About Friendzy</a></p>
    </div>
  </main>
  <script>
    (function () {
      // Flip to true the day Apple approves Friendzy for iPhone.
      var iosLive = false;
      var appStoreUrl = "https://apps.apple.com/app/id6782549607";
      var playStoreUrl = "https://play.google.com/store/apps/details?id=com.nullclub.friendzy";
      var ua = navigator.userAgent || navigator.vendor || "";
      var isAndroid = /Android/i.test(ua);
      var isiOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (!iosLive) {
        var a = document.getElementById("appstore");
        a.textContent = "iPhone: coming soon";
        a.removeAttribute("href");
        a.setAttribute("aria-disabled", "true");
        a.style.opacity = "0.5";
      }
      if (isAndroid) {
        window.location.replace(playStoreUrl);
        return;
      }
      if (isiOS) {
        if (iosLive) {
          window.location.replace(appStoreUrl);
        } else {
          document.getElementById("msg").textContent = "Friendzy is coming to iPhone very soon. It's already on Android: send this link to a friend with an Android phone!";
          document.getElementById("msg-es").textContent = "Friendzy llega muy pronto a iPhone. Ya está en Android.";
        }
      }
    })();
  </script>
</body>
</html>

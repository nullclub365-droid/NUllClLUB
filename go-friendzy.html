<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Friendzy | NULL CLUB</title>
  <meta name="description" content="Get Friendzy, free party games for your friend group.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link href="/css/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <div class="page-content" style="text-align:center">
      <h1>Get Friendzy 🦊</h1>
      <p id="msg">Free party games for your friend group. Taking you to your app store…</p>
      <p lang="es" id="msg-es">Juegos de fiesta gratis para tu grupo. Te llevamos a tu tienda de apps…</p>
      <div class="cta-row" style="justify-content:center">
        <a href="https://apps.apple.com/app/id6782549607" id="appstore" class="cta" target="_blank" rel="noopener noreferrer">App Store</a>
        <a href="https://play.google.com/store/apps/details?id=com.nullclub.friendzy" id="playstore" class="cta cta-ghost" target="_blank" rel="noopener noreferrer">Google Play</a>
      </div>
      <p class="app-outro"><a href="friendzy.html">About Friendzy</a></p>
    </div>
  </main>
  <script>
    (function () {
      // iPhone is live on the App Store.
      var iosLive = true;
      var appStoreUrl = "https://apps.apple.com/app/id6782549607";
      var playStoreUrl = "https://play.google.com/store/apps/details?id=com.nullclub.friendzy";
      // Attribution: ?s=tiktok|instagram|youtube (any short a-z0-9_- tag) becomes the Play install
      // referrer, so Play Console reports installs per source under Acquisition -> utm_source.
      var src = (new URLSearchParams(window.location.search).get("s") || "").toLowerCase();
      src = /^[a-z0-9_-]{1,20}$/.test(src) ? src : "direct";
      playStoreUrl += "&referrer=" + encodeURIComponent("utm_source=" + src + "&utm_medium=social&utm_campaign=friendzy");
      document.getElementById("playstore").href = playStoreUrl;
      var ua = navigator.userAgent || navigator.vendor || "";
      var isAndroid = /Android/i.test(ua);
      var isiOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      var appBtn = document.getElementById("appstore");
      var playBtn = document.getElementById("playstore");
      if (isAndroid) {
        window.location.replace(playStoreUrl);
        return;
      }
      if (isiOS) {
        // iPhone/iPad visitors only ever see the App Store (App Review, Guideline 2.3.10).
        playBtn.style.display = "none";
        if (iosLive) { window.location.replace(appStoreUrl); return; }
        // Not live yet: say so, with no mention of another platform's store.
        appBtn.textContent = "iPhone: coming soon";
        appBtn.removeAttribute("href");
        appBtn.setAttribute("aria-disabled", "true");
        appBtn.style.opacity = "0.5";
        document.getElementById("msg").textContent = "Friendzy is coming to iPhone very soon.";
        document.getElementById("msg-es").textContent = "Friendzy llega muy pronto a iPhone.";
        return;
      }
      if (!iosLive) {
        appBtn.textContent = "iPhone: coming soon";
        appBtn.removeAttribute("href");
        appBtn.setAttribute("aria-disabled", "true");
        appBtn.style.opacity = "0.5";
      }
    })();
  </script>
</body>
</html>
